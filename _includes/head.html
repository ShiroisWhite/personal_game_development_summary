<script>
/* 首屏前套用深浅色，避免闪白 */
(function () {
  try {
    var t = localStorage.getItem("gd-theme");
    if (t === "light" || t === "dark") { document.documentElement.setAttribute("data-theme", t); }
  } catch (e) {}
})();
</script>

<!-- GitHub 风格行内公式 $`x`$ → $x$（在 MathJax 排版前改写） -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var nodes = document.querySelectorAll("p, div, span, li, td, th, h1, h2, h3, h4, h5, h6");
  var changed = 0;
  nodes.forEach(function (el) {
    var before = el.innerHTML;
    var after = before
      .replace(/\$<code class="language-plaintext highlighter-rouge">([^<]+)<\/code>\$/g, "$$$1$$")
      .replace(/\$<code[^>]*>([^<]+)<\/code>\$/g, "$$$1$$");
    if (after !== before) { el.innerHTML = after; changed++; }
  });
  if (changed && window.MathJax && window.MathJax.typesetPromise) {
    MathJax.typesetPromise();
  }
});
</script>

<!-- MathJax 3 -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [["$", "$"], ["\\(", "\\)"]],
    displayMath: [["$$", "$$"], ["\\[", "\\]"]],
    processEscapes: true,
    processEnvironments: true,
    packages: { "[+]": ["base", "ams", "noerrors", "noundefined", "autoload"] }
  },
  options: {
    ignoreHtmlClass: "tex2jax_ignore",
    processHtmlClass: "tex2jax_process"
  },
  loader: { load: ["[tex]/noerrors"] },
  startup: { ready: function () { MathJax.startup.defaultReady(); } }
};
</script>
<script async id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
